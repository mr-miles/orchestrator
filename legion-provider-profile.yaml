id: legion-controller
display_name: Legion orchestrator
description: Controller access (MCP + git) with a task-scoped token obtained from
  the sandbox's SPIFFE JWT-SVID
category: other
credentials:
- name: access_token
  description: Short-lived controller token (client_credentials, jwt-spiffe client
    assertion)
  required: false
  auth_style: bearer
  header_name: Authorization
  token_grant:
    grant_type: client_credentials
    token_endpoint: http://127.0.0.1:8768/oauth/token
    audience: legion-controller
    jwt_svid_audience: legion-controller
    client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-spiffe
    scopes:
    - legion
    cache_ttl_seconds: 120
endpoints:
- host: host.openshell.internal
  port: 8766
  path: /mcp
  protocol: mcp
  enforcement: enforce
  mcp:
    versions:
    - '2025-06-18'
    - '2025-11-25'
    - '2026-07-28'
  rules:
  - allow:
      method: initialize
  - allow:
      method: notifications/initialized
  - allow:
      method: notifications/cancelled
  - allow:
      method: ping
  - allow:
      method: tools/list
  - allow:
      method: server/discover
  - allow:
      method: tools/call
      tool:
        any:
        - docs_list
        - docs_read
        - docs_history
        - docs_write
        - docs_schema
        - schema_get
        - whoami
        - get_assignment
        - verify_attestation
        - progress
        - report
- host: host.openshell.internal
  port: 8767
  protocol: rest
  enforcement: enforce
  rules:
  - allow:
      method: GET
      path: /git/*.git/**
  - allow:
      method: HEAD
      path: /git/*.git/**
  - allow:
      method: OPTIONS
      path: /git/*.git/**
  - allow:
      method: POST
      path: /git/*.git/git-upload-pack
  - allow:
      method: POST
      path: /git/*.git/git-receive-pack
binaries:
- /usr/local/bin/claude
- /usr/bin/git
- /usr/lib/git-core/git-remote-http
- /usr/lib/git-core/git-remote-https
