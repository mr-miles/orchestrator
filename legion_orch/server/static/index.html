<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legion Orchestrator</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a; --text:#e6e8eb; --muted:#9aa3b2;
    --PENDING:#6b7280; --READY:#60a5fa; --RUNNING:#3b82f6; --VERIFYING:#a855f7; --REVIEWING:#eab308;
    --MERGING:#06b6d4; --REWORK:#f97316; --ACCEPTED:#22c55e; --ESCALATED:#ef4444; --FAILED:#991b1b;
    --AWAITING_HUMAN:#ec4899;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; font-weight:600; color:#0b0d10; }
  .pill { display:inline-block; padding:1px 7px; border-radius:4px; background:var(--panel2); border:1px solid var(--line); font-size:11px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  main { display:grid; grid-template-columns: minmax(0,1fr) 440px; gap:12px; padding:12px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-width:0; }
  section h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; font-weight:600; }
  #pipeline { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .stage { padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; }
  .stage .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .arrow { color:var(--muted); }
  #progressbar { height:8px; background:var(--panel2); border-radius:4px; overflow:hidden; display:flex; margin:8px 0 4px; }
  #progressbar div { height:100%; }
  #graphwrap { overflow:auto; max-height:62vh; border:1px solid var(--line); border-radius:6px; background:#12151b; }
  svg text { fill:var(--text); font-size:11px; }
  .node rect { stroke-width:1.5; cursor:pointer; }
  .node.sel rect { stroke:#fff !important; stroke-width:2.5; }
  .node.RUNNING rect, .node.VERIFYING rect, .node.REVIEWING rect { animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.65; } }
  .edge { fill:none; stroke:#3a4150; stroke-width:1.4; }
  .edge.done { stroke:#2f6b40; }
  .tabs { display:flex; gap:4px; margin-bottom:8px; flex-wrap:wrap; }
  .tabs button { background:var(--panel2); color:var(--muted); border:1px solid var(--line); padding:4px 10px; border-radius:5px; cursor:pointer; }
  .tabs button.on { color:var(--text); border-color:#4b5563; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:11px; }
  pre { white-space:pre-wrap; word-break:break-word; background:#0b0d11; border:1px solid var(--line); border-radius:6px; padding:8px; max-height:420px; overflow:auto; margin:6px 0; }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:8px; margin:6px 0; }
  .sev-BLOCKER { color:#f87171; } .sev-WARNING { color:#fbbf24; } .sev-SUGGESTION { color:#93c5fd; }
  input, textarea, select { background:#0b0d11; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:5px 7px; font:inherit; width:100%; }
  textarea { min-height:60px; }
  button.act { background:#2563eb; color:#fff; border:0; padding:5px 12px; border-radius:5px; cursor:pointer; margin:4px 4px 0 0; font-weight:600; }
  button.act.warn { background:#b45309; } button.act.danger { background:#b91c1c; } button.act.ok { background:#15803d; }
  .err { color:#f87171; }
  .row { display:flex; gap:8px; align-items:center; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:6px; }
  #live .card { border-left:3px solid var(--RUNNING); }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:2px 8px; }
  .kv div:nth-child(odd) { color:var(--muted); }
  a { color:#93c5fd; cursor:pointer; text-decoration:none; }
  .gate-satisfied { color:#4ade80; } .gate-unsatisfied { color:#f87171; } .gate-unevaluable { color:#fbbf24; }
</style>
</head>
<body>
<header>
  <h1>Legion Orchestrator</h1>
  <select id="changeSel" style="width:auto;max-width:340px" data-onchange="pickChange"></select>
  <button class="act" style="margin:0" data-on="newChange" data-args="[]">+ New change</button>
  <span id="hdr" class="muted">loading…</span>
  <span style="flex:1"></span>
  <label class="muted">approver <input id="approver" style="width:120px"></label>
  <label class="muted">operator token <input id="optoken" type="password" style="width:120px"></label>
</header>
<main>
  <div style="display:flex; flex-direction:column; gap:12px; min-width:0">
    <section id="startbox" style="display:none">
      <h2>Start a change</h2>
      <textarea id="goal" placeholder="Describe the goal for the agents…"></textarea>
      <button class="act" data-on="startChange" data-args="[]">Start intake</button> <span id="starterr" class="err"></span>
    </section>
    <section>
      <h2>Workflow</h2>
      <div id="pipeline"></div>
      <div id="progressbar"></div>
      <div id="progresstext" class="muted"></div>
    </section>
    <section>
      <h2>Task graph</h2>
      <div id="graphwrap"><svg id="graph"></svg></div>
      <div id="legend" class="muted" style="margin-top:6px"></div>
    </section>
    <section>
      <div class="tabs" id="tabs"></div>
      <div id="tabbody"></div>
    </section>
  </div>
  <div style="display:flex; flex-direction:column; gap:12px; min-width:0">
    <section id="live"><h2>Live agents</h2><div id="livebody" class="muted">none</div></section>
    <section><h2>Details</h2><div id="detail" class="muted">Select a node in the graph.</div></section>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
