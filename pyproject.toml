[project]
name = "legion-orchestrator"
version = "0.1.0"
description = "Workflow controller for Legion-style guarded multi-agent software delivery in OpenShell sandboxes"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "jsonschema>=4.23",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    "pydantic>=2.7",
    "a2a-sdk[http-server]>=1.3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "hypothesis>=6",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
telemetry = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
dev = ["ruff>=0.6", "build>=1.2"]

[project.scripts]
legion-orch = "legion_orch.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["legion_orch", "legion_orch.store", "legion_orch.git", "legion_orch.identity", "legion_orch.workflow",
            "legion_orch.sandbox", "legion_orch.server"]

[tool.setuptools.package-data]
"legion_orch.server" = ["static/dist/*", "static/dist/assets/*"]   # built by bun from frontend/

[tool.pytest.ini_options]
testpaths = ["tests"]
# every scenario makes git repositories, sandboxes and a state store: keep only failed tests'
# directories (a full run's would otherwise fill a small /tmp)
tmp_path_retention_policy = "failed"
# independent tests (their own temp directories, free ports): one worker per CPU – CI's and
# mise's plain `pytest -q` included; `-n 0` runs serially (e.g. to debug one test)
addopts = "-n auto"
# each test's kind, set in tests/conftest.py (``-m "not e2e"``: the quick run)
markers = [
  "unit: no change is driven (pure functions, single components)",
  "scenario: a change driven through the engine by the test harness",
  "e2e: the real controller over HTTP, and the telemetry acceptance tests",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E731", "B008"]

[dependency-groups]
dev = [
    "import-linter>=2.17",
]

# The engine's layering (docs/architecture.md §1, §5), checked by `lint-imports` (and by
# tests/test_units.py): control and imports go down the layers only, and nothing outside the
# engine – nor its facade – reaches into them.
[tool.importlinter]
root_package = "legion_orch"

[[tool.importlinter.contracts]]
name = "The engine's layers: runtime > steps > services > sandboxes > base"
type = "layers"
layers = [
    "legion_orch.workflow.engine.runtime",
    "legion_orch.workflow.engine.steps",
    "legion_orch.workflow.engine.services",
    "legion_orch.workflow.engine.sandboxes",
    "legion_orch.workflow.engine.base",
]

[[tool.importlinter.contracts]]
name = "Outside the engine, only the engine package's own names"
type = "forbidden"
source_modules = [
    "legion_orch.server",
    "legion_orch.cli",
    "legion_orch.workflow.roles",
    "legion_orch.workflow.governance",
    "legion_orch.workflow.guards",
    "legion_orch.workflow.ship",
    "legion_orch.workflow.attention",
    "legion_orch.workflow.view",
]
forbidden_modules = [
    "legion_orch.workflow.engine.runtime",
    "legion_orch.workflow.engine.steps",
    "legion_orch.workflow.engine.services",
    "legion_orch.workflow.engine.sandboxes",
    "legion_orch.workflow.engine.base",
    "legion_orch.workflow.engine.compose",
    "legion_orch.workflow.engine.change",
    "legion_orch.workflow.engine.controller",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The facade never sees the step layer: it fronts the runtime"
type = "forbidden"
source_modules = ["legion_orch.workflow.engine.change", "legion_orch.workflow.engine.controller"]
forbidden_modules = [
    "legion_orch.workflow.engine.steps",
    "legion_orch.workflow.engine.sandboxes",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The workflow core is pure: no engine"
type = "forbidden"
source_modules = ["legion_orch.workflow.flow"]
forbidden_modules = ["legion_orch.workflow.engine"]
