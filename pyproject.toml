[project]
name = "legion-orchestrator"
version = "0.1.0"
description = "Workflow controller for Legion-style guarded multi-agent software delivery in OpenShell sandboxes"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3", "starlette>=1.0", "uvicorn>=0.30", "pyyaml>=6", "jsonschema>=4.23"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
legion-orch = "legion_orch.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["legion_orch", "legion_orch.store"]

[tool.setuptools.package-data]
legion_orch = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
