[project]
name = "legion-orchestrator"
version = "0.1.0"
description = "Workflow controller for Legion-style guarded multi-agent software delivery in OpenShell sandboxes"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3", "starlette>=1.0", "uvicorn>=0.30", "pyyaml>=6", "jsonschema>=4.23",
                "pyjwt[crypto]>=2.8", "httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "esprima>=4.0"]
dev = ["ruff>=0.6", "build>=1.2"]

[project.scripts]
legion-orch = "legion_orch.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["legion_orch", "legion_orch.store", "legion_orch.git", "legion_orch.identity", "legion_orch.workflow",
            "legion_orch.sandbox", "legion_orch.server"]

[tool.setuptools.package-data]
"legion_orch.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E731", "B008"]
