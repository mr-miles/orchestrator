# Build, lint and test the backend and the frontend with the mise tasks (mise.toml: the same
# tools and commands as a local `mise run check`), then assemble the release zip.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2          # installs python, uv, buned)
      - name: Typecheck, lint, format check, tests
        run: mise run ui:check
      - name: Build
        run: mise run ui:build
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: legion_orch/server/static/dist
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - name: Lint (ruff, the assets and the environment library)
        run: mise run lint
      - name: Tests (in parallel: pytest addopts -n auto)
        run: mise run test

  package:
    name: Release zip
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: legion_orch/server/static/dist
      - name: Build the zip
        id: zip
        run: echo "path=$(mise run -q package:zip)" >> "$GITHUB_OUTP
      - name: Smoke test from a clean unpack, with uv only
        run: |
          work="$RUNNER_TEMP/unpacked"
          mkdir -p "$work" && unzip -q "${{ steps.zip.outputs.path }
          cd "$work"/legion-orchestrator-*
          test -f legion_orch/server/static/dist/index.html
          uv run legion-orch -c orchestrator.example.yaml check
          uv run python -c "from legion_orch.server import web; asse').is_file()"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.zip.outputs.path }}
          archive: false
          if-no-files-found: error
