# Path (relative to changes/<id>/) -> schema. First match wins; the last entry is the catch-all.
# The store validates every write against the bound schema and records its name and sha.

# ---- agents' outputs: under their ticket's directory (tickets/<id>/), by the name the role's
# prompt gives them
- {pattern: "tickets/*/requirements.md", schema: requirements}
- {pattern: "tickets/*/risk.json", schema: risk}
- {pattern: "tickets/*/questions.md", schema: questions}
- {pattern: "tickets/*/spec.md", schema: markdown}
- {pattern: "tickets/*/specs/REQ-*.md", schema: delta-spec}
- {pattern: "tickets/*/oracle.json", schema: oracle}
- {pattern: "tickets/*/environment.json", schema: environment}
- {pattern: "tickets/*/evidence*.md", schema: evidence}
- {pattern: "tickets/*/release-plan.md", schema: release-plan}
# ---- controller documents
- {pattern: "control/change.json", schema: change}
# runs are audit: their ids are unique, so they live under control/runs/<run>/ (the assignment
# names its ticket and attempt)
- {pattern: "control/runs/*/assignment.json", schema: run-assignment}
- {pattern: "control/runs/*/outcome.json", schema: run-outcome}
- {pattern: "control/runs/*/log*", schema: text}
- {pattern: "control/environment/build.json", schema: environment-build}
- {pattern: "control/environment/*.log", schema: text}
# ---- everything else
- {pattern: "*.json", schema: json}
- {pattern: "*.md", schema: markdown}
- {pattern: "*", schema: text}
