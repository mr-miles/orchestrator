intake:
  soul: intake-analyst
  skills: [harness-contract, docstore-protocol, attestation-format, risk-signals, blocked-protocol]
  write: ["intake/"]
  required_docs: ["intake/requirements.md", "intake/risk.json"]
  git: none
  report_schema: report-none
  repo: true
planner:
  soul: architect-planner
  skills: [harness-contract, docstore-protocol, attestation-format, taskgraph-schema, blocked-protocol]
  write: ["plan/"]
  required_docs: ["plan/spec.md", "plan/oracle.json", "plan/taskgraph.json"]
  git: none
  report_schema: report-none
  repo: true
critic:
  soul: plan-critic
  skills: [harness-contract, docstore-protocol, attestation-format, pre-mortem, finding-format]
  write: ["critique/"]
  required_docs: ["critique/cycle-{{cycle}}.md"]
  git: none
  report_schema: report-critique
  repo: true
oracle:
  soul: test-engineer
  skills: [harness-contract, docstore-protocol, attestation-format, git-protocol, blocked-protocol]
  write: ["oracle/"]
  required_docs: ["oracle/tests.md"]
  git: commit
  report_schema: report-none
  repo: true
baseline:
  soul: baseline-verifier
  skills: [harness-contract, docstore-protocol, attestation-format, git-protocol]
  write: ["baseline/"]
  required_docs: ["baseline/report.md"]
  git: head
  report_schema: report-baseline
  repo: true
implementer:
  soul: "{{task_soul}}"
  souls_allowed: [senior-developer, backend-engineer, frontend-engineer]
  skills: [harness-contract, docstore-protocol, attestation-format, git-protocol, blocked-protocol]
  write: ["tasks/{{task_id}}/evidence/"]
  required_docs: ["tasks/{{task_id}}/evidence/cycle-{{cycle}}.md"]
  git: commit
  report_schema: report-none
  repo: true
reviewer:
  soul: code-reviewer
  skills: [harness-contract, docstore-protocol, attestation-format, git-protocol, finding-format]
  write: ["tasks/{{task_id}}/reviews/reviewer-"]   # own files only: panel members cannot touch each other's
  required_docs: ["tasks/{{task_id}}/reviews/reviewer-cycle-{{cycle}}.md"]
  git: candidate
  report_schema: report-review
  repo: true
security:
  soul: security-reviewer
  skills: [harness-contract, docstore-protocol, attestation-format, git-protocol, finding-format, security-checklist]
  write: ["tasks/{{task_id}}/reviews/security-"]   # own files only: panel members cannot touch each other's
  required_docs: ["tasks/{{task_id}}/reviews/security-cycle-{{cycle}}.md"]
  git: candidate
  report_schema: report-review
  repo: true
integration:
  soul: integration-verifier
  skills: [harness-contract, docstore-protocol, attestation-format, git-protocol, finding-format]
  write: ["integration/"]
  required_docs: ["integration/report.md"]
  git: head
  report_schema: report-integration
  repo: true
release:
  soul: release-planner
  skills: [harness-contract, docstore-protocol, attestation-format]
  write: ["release/"]
  required_docs: ["release/plan.md", "release/rollback.md"]
  git: none
  report_schema: report-none
  repo: true
architecture:
  soul: architecture-reviewer
  skills: [harness-contract, docstore-protocol, attestation-format, git-protocol, finding-format, architecture-checklist]
  write: ["tasks/{{task_id}}/reviews/architecture-"]   # own files only: panel members cannot touch each other's
  required_docs: ["tasks/{{task_id}}/reviews/architecture-cycle-{{cycle}}.md"]
  git: candidate
  report_schema: report-review
  repo: true
