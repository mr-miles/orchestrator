intake:
  soul: intake-analyst
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format, risk-signals, blocked-protocol]
  write: ["intake/"]
  required_docs: ["intake/requirements.md", "intake/risk.json"]
  outputs: [requirements, risk]
  git: none
  report_schema: report-none
  repo: true
planner:
  soul: architect-planner
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format, taskgraph-schema, sandbox-environment, blocked-protocol, language-preferences]
  write: ["{{plan}}/spec.md", "{{plan}}/specs/", "{{plan}}/oracle.json", "{{plan}}/taskgraph.json", "{{plan}}/environment.json"]
  required_docs: ["{{plan}}/spec.md", "{{plan}}/oracle.json", "{{plan}}/taskgraph.json"]
  outputs: [spec, oracle, tickets, environment, "specs*"]
  git: none
  report_schema: report-none
  repo: true
critic:
  soul: plan-critic
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format, pre-mortem, finding-format, language-preferences]
  write: ["{{plan}}/critique/"]
  required_docs: ["{{plan}}/critique/cycle-{{cycle}}.md"]
  outputs: [critique]
  git: none
  report_schema: report-critique
  repo: true
oracle:
  soul: test-engineer
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format, git-protocol, blocked-protocol, language-preferences]
  write: ["{{step}}/"]
  required_docs: ["{{step}}/tests.md"]
  outputs: [tests]
  git: commit
  report_schema: report-none
  repo: true
baseline:
  soul: baseline-verifier
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format, git-protocol]
  write: ["{{step}}/"]
  required_docs: ["{{step}}/report.md"]
  outputs: [report]
  git: head
  report_schema: report-baseline
  repo: true
implementer:
  soul: "{{task_soul}}"
  souls_allowed: [senior-developer, backend-engineer, frontend-engineer]
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format, git-protocol, blocked-protocol, language-preferences]
  write: ["tasks/{{task_id}}/evidence/"]
  required_docs: ["tasks/{{task_id}}/evidence/cycle-{{cycle}}.md"]
  outputs: [evidence]
  work_schema: work-implementer       # its ticket's `work` (tickets.json)
  git: commit
  report_schema: report-none
  repo: true
reviewer:
  soul: code-reviewer
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format, git-protocol, finding-format, language-preferences]
  write: ["tasks/{{task_id}}/reviews/reviewer-"]   # own files only: panel members cannot touch each other's
  required_docs: ["tasks/{{task_id}}/reviews/reviewer-cycle-{{cycle}}.md"]
  outputs: [review]
  git: candidate
  report_schema: report-review
  repo: true
security:
  soul: security-reviewer
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format, git-protocol, finding-format, security-checklist]
  write: ["tasks/{{task_id}}/reviews/security-"]   # own files only: panel members cannot touch each other's
  required_docs: ["tasks/{{task_id}}/reviews/security-cycle-{{cycle}}.md"]
  outputs: [review]
  git: candidate
  report_schema: report-review
  repo: true
integration:
  soul: integration-verifier
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format, git-protocol, finding-format]
  write: ["{{step}}/"]
  required_docs: ["{{step}}/report.md"]
  outputs: [report]
  git: head
  report_schema: report-integration
  repo: true
describer:
  soul: pr-writer
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format, git-protocol, blocked-protocol]
  write: ["delivery/pr.md"]
  required_docs: ["delivery/pr.md"]
  outputs: [pr]
  git: head
  report_schema: report-none
  repo: true
pr-reviewer:
  soul: pr-reviewer
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format, git-protocol, finding-format]
  write: ["delivery/reviews/pr-reviewer-"]
  required_docs: ["delivery/reviews/pr-reviewer-cycle-{{cycle}}.md"]
  outputs: [review]
  git: head
  report_schema: report-critique
  repo: true
release:
  soul: release-planner
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format]
  write: ["release/"]
  required_docs: ["release/plan.md", "release/rollback.md"]
  outputs: [plan, rollback]
  git: none
  report_schema: report-none
  repo: true
architecture:
  soul: architecture-reviewer
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format, git-protocol, finding-format, architecture-checklist]
  write: ["tasks/{{task_id}}/reviews/architecture-"]   # own files only: panel members cannot touch each other's
  required_docs: ["tasks/{{task_id}}/reviews/architecture-cycle-{{cycle}}.md"]
  outputs: [review]
  git: candidate
  report_schema: report-review
  repo: true
retrospective:
  soul: retrospective-analyst
  skills: [harness-contract, a2a-protocol, a2a-cli, docstore-protocol, attestation-format]
  write: ["retro/"]
  required_docs: ["retro/report.md"]
  outputs: [report]
  git: none
  report_schema: report-none
  repo: true
resolver:
  soul: resolver
  skills: [resolution-protocol, a2a-protocol, a2a-cli, docstore-protocol, attestation-format, blocked-protocol]
  write: []                      # it proposes; the controller records its proposals
  required_docs: []
  outputs: []
  git: none
  report_schema: report-none
  repo: true
