project: demo
repo:
  name: app                      # used in attestations: git:app/<path>@<sha>
  path: /path/to/your/repo       # local path or URL the controller clones (bare) once;
                                 # omit it to start a new, empty repository
  base_branch: main
decision_owners: [miles]         # humans allowed to approve (H-1/H-2/H-3, escalations)
state_dir: .legion-orch          # set once: state.db (store), git/, tmp/ – holds every change
assets_dir: assets               # roles.yaml, souls/, skills/, prompts/
workflow_doc: WORKFLOW.md        # shown in the UI only
protected_paths: [".github/", "WORKFLOW.md"]
server:
  host: 127.0.0.1                # operator UI/API (human gates) – never expose to sandboxes
  port: 8765
  agent_host: 0.0.0.0            # agent-facing listeners (sandboxes must reach these)
  mcp_port: 8766                 # /mcp – vetted by the gateway as protocol: mcp
  mcp_max_body_bytes: 8388608    # largest MCP request the gateway inspects (OpenShell default 64 KiB)
  agent_keep_alive_s: 600        # idle agent connections stay open (uvicorn default 5s => ECONNRESET)
  git_port: 8767                 # /git/<repo>.git only
  token_port: 8768               # /oauth/token only (gateway supervisor)
  public_host: host.openshell.internal   # how sandboxes reach the agent-facing listeners
  token_host: 127.0.0.1          # how the gateway reaches /oauth/token (loopback, an in-cluster
                                 # service, or set token_scheme: https)
  # operator_token: set LEGION_OPERATOR_TOKEN instead of committing it
limits:
  max_parallel: 4
  review_max_cycles: 3
  critique_max_cycles: 2
  max_report_attempts: 3
  run_timeout_s: 3600
  verify_timeout_s: 1800
  git_max_push_bytes: 268435456   # largest accepted push (HTTP body and unpacked pack)
  git_max_concurrency: 8
  max_docs_per_run: 200           # per-run document write quota (G-W4)
  max_doc_bytes_per_run: 52428800
sandbox:
  runner: openshell              # or `local` for development (NO isolation)
  openshell_bin: openshell
  workspace: default             # OpenShell workspace targeted by every openshell call
  # gateway: my-gateway          # optional OpenShell gateway name (-g); default: active one
  image: registry.example.com/your-org/claude-agent:latest
  verifier_image: registry.example.com/your-org/toolchain:latest
  providers: [claude-code]       # model credentials; legion-mcp and legion-git(-push) are added automatically
  agent_binaries: [/usr/local/bin/claude]   # binaries allowed to call the controller's MCP
  # git_binaries: [/usr/bin/git, /usr/lib/git-core/git-remote-http, /usr/lib/git-core/git-remote-https]
  #   allowed to reach the controller's git remote; Fedora/RHEL/Alpine use /usr/libexec/git-core/
  templates_dir: policies         # templates for everything created in OpenShell (see policies/README.md)
  keep_failed: true
  # root: /sandbox                 # payload and working copy inside the sandbox; match your image,
  # run_as_user: sandbox           # e.g. root: /home/agent, run_as_user: agent, run_as_group: agent
  # run_as_group: sandbox
environment:                     # sandbox-environment stage (WORKFLOW.md §5.3a); omit to disable
  library_dir: environments      # reusable tools/ (mise) and policies/ (network) – see its README
  podman_bin: podman             # builds the images on this host (FROM sandbox.image / verifier_image)
  mise_version: v2026.11.0       # mise installed into every environment image
  # registry: registry.example.com/your-org   # push images here if the gateway cannot see
  #                                            # this host's local podman images
  build_timeout_s: 1800
  max_memory_mib: 32768          # caps on what a spec may request per sandbox (G-E3): memory and
  max_vcpus: 16                  # vCPUs become sandbox create --memory / --cpu, disk is
  max_disk_mib: 204800           # --driver-config-json (policies/sandbox-resources.template.yaml)
identity:                        # SPIFFE/SPIRE workload identity (see legion_orch/identity.py); the
                                 # controller's provider profiles: legion-orch setup-openshell --apply
  jwks_uri: https://spire-spiffe-oidc-discovery-provider.spire.svc.cluster.local/keys
  issuer: https://spire-spiffe-oidc-discovery-provider.spire.svc.cluster.local
  trust_prefix: "spiffe://openshell.local/openshell/sandbox/"
  svid_audience: legion-controller
  token_audience: legion-controller
  subject_field: id              # field of `openshell sandbox get -o json` used in the SPIFFE ID
