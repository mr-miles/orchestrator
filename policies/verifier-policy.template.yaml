# OpenShell sandbox policy for deterministic verifier sandboxes: git fetch from the controller,
# nothing else (no model, no MCP). Add package-registry endpoints only if verification commands
# must install dependencies (prefer baking them into the verifier image).
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  legion_git:
    name: legion-git
    endpoints:
      - host: ${CONTROLLER_HOST}
        port: ${CONTROLLER_PORT}
        path: ${GIT_PATH_GLOB}
        protocol: rest
        tls: ${CONTROLLER_TLS}
        enforcement: enforce
        rules:
          - allow: { method: GET, path: ${GIT_INFO_REFS} }
          - allow: { method: POST, path: ${GIT_UPLOAD_PACK} }
        deny_rules:
          - { method: POST, path: ${GIT_RECEIVE_PACK} }
    binaries: ${GIT_BINARIES}
