# OpenShell sandbox policy for deterministic verifier sandboxes: no model access, read-only
# git fetch from the controller only. Add package-registry endpoints here if your verification
# commands must install dependencies (prefer baking them into verifier_image instead).
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  legion_git:
    name: legion-git
    endpoints:
      - { host: __CONTROLLER_HOST__, port: __CONTROLLER_PORT__ }
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-http }
      - { path: /usr/lib/git-core/git-remote-https }
