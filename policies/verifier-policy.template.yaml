# OpenShell sandbox policy for deterministic verifier sandboxes: git fetch from the controller
# (the attached legion-git provider profile), nothing else (no model, no MCP). Add
# package-registry endpoints only if verification commands must install dependencies (prefer
# baking them into the verifier image).
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: ${SANDBOX_WRITABLE}
landlock:
  compatibility: best_effort
process:
  run_as_user: ${RUN_AS_USER}
  run_as_group: ${RUN_AS_GROUP}
network_policies: {}
  # Nothing here: git fetch comes from the legion-git provider profile. The controller adds the
  # sandbox environment's network policies (env_*) here.
