# OpenShell sandbox policy for deterministic verifier sandboxes – static part.
# legion-orch adds a generated legion_git entry (fetch only; push denied). No model access and
# no MCP. Add package-registry endpoints here only if verification commands must install
# dependencies (prefer baking them into verifier_image instead).
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies: {}
