id: claude-subscription
display_name: Claude Code (subscription)
description: Claude Code CLI with a Claude subscription OAuth token
category: agent
inference_capable: true
credentials:
  - name: oauth_token
    description: OAuth token from `claude setup-token`
    env_vars: [CLAUDE_CODE_OAUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [oauth_token]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: ${PROFILE_BINARIES}
