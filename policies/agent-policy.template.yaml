# OpenShell sandbox policy for agent runs (critic, planner, implementer, reviewers, ...).
# Rendered per sandbox by legion-orch; placeholders: see policies/README.md.
# No credentials appear here. Controller access comes from the attached provider profiles:
# legion-mcp (MCP) and legion-git or legion-git-push (git), whose endpoints OpenShell adds to the
# effective policy and whose token grant injects a SPIFFE-derived bearer at the gateway.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: ${SANDBOX_WRITABLE}
landlock:
  compatibility: best_effort
process:
  run_as_user: ${RUN_AS_USER}
  run_as_group: ${RUN_AS_GROUP}
network_policies: {}
  # Nothing here: controller MCP and git come from the legion-mcp and legion-git(-push) provider
  # profiles, and the model endpoint from the model provider (sandbox.providers), each with its
  # inspected rules and credential. A plain L4 rule for a credentialed host is refused by the
  # gateway as an uninspected credential path. The controller adds the sandbox environment's
  # network policies (env_*) here.
