# OpenShell sandbox policy for agent runs – static part.
# legion-orch adds two generated entries per sandbox (legion_orch/policy.py):
#   legion_mcp  – protocol: mcp on the controller's MCP port; the gateway vets every JSON-RPC
#                 request and allows only the handshake methods and the controller's tools
#   legion_git  – protocol: rest on the controller's git endpoint; push only for roles that push
# Do not declare legion_mcp / legion_git here. Credentials are never placed in the sandbox: the
# workspace `legion-controller` provider injects a SPIFFE-derived bearer at the gateway.
# Adjust binary paths to your agent image (`openshell sandbox exec <n> -- which claude git`).
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  # Model provider (credentials are injected by the OpenShell provider, never by legion-orch).
  claude_anthropic:
    name: claude_anthropic
    endpoints:
      - { host: api.anthropic.com, port: 443 }
      - { host: statsig.anthropic.com, port: 443 }
    binaries:
      - { path: /usr/local/bin/claude }
