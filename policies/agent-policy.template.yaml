# OpenShell sandbox policy for agent runs (rendered per sandbox by legion-orch).
# __CONTROLLER_HOST__/__CONTROLLER_PORT__ come from server.public_url.
# Adjust binary paths to match your agent image (`openshell sandbox exec <n> -- which claude git`).
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  # MCP tools (/mcp/) and the git remote (/git/) served by the controller.
  legion_controller:
    name: legion-controller
    endpoints:
      - { host: __CONTROLLER_HOST__, port: __CONTROLLER_PORT__ }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-http }
      - { path: /usr/lib/git-core/git-remote-https }
  # Model provider (credentials are injected by the OpenShell provider, never by legion-orch).
  claude_anthropic:
    name: claude_anthropic
    endpoints:
      - { host: api.anthropic.com, port: 443 }
      - { host: statsig.anthropic.com, port: 443 }
    binaries:
      - { path: /usr/local/bin/claude }
