# Provider profile `legion-mcp`, imported once per workspace (`legion-orch setup-openshell`) and
# attached to every agent sandbox (not verifiers). Attaching it is what lets the agent CLI reach
# the controller's MCP endpoint: OpenShell adds these endpoints to the sandbox's effective policy,
# so the sandbox policy templates need no rule for them. The gateway exchanges the sandbox's
# SPIFFE JWT-SVID at the controller and injects the returned task-scoped bearer.
id: ${PROFILE_ID}
display_name: Legion controller MCP
description: Controller MCP endpoint (vetted methods and tools) with a task-scoped token obtained from the sandbox's SPIFFE JWT-SVID
category: other
credentials:
  - name: access_token
    description: Short-lived controller token (client_credentials, jwt-spiffe client assertion)
    required: false
    auth_style: bearer
    header_name: Authorization
    token_grant:
      grant_type: client_credentials
      token_endpoint: ${TOKEN_ENDPOINT}
      audience: ${TOKEN_AUDIENCE}
      jwt_svid_audience: ${SVID_AUDIENCE}
      client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-spiffe
      scopes: [${SCOPE}]
      cache_ttl_seconds: ${TOKEN_CACHE_TTL}
endpoints:
  # Own port: OpenShell does not allow MCP to share a host:port with another protocol.
  - host: ${MCP_HOST}
    port: ${MCP_PORT}
    path: ${MCP_PATH}
    protocol: mcp
    enforcement: enforce
    # the gateway drops larger requests with a connection reset (server.mcp_max_body_bytes)
    json_rpc_max_body_bytes: ${MCP_MAX_BODY_BYTES}
    mcp:
      versions: ${MCP_VERSIONS}
    rules:
      - allow: { method: initialize }
      - allow: { method: notifications/initialized }
      - allow: { method: notifications/cancelled }
      - allow: { method: ping }
      - allow: { method: tools/list }
      - allow: { method: server/discover }
      - allow: { method: subscriptions/listen }      # 2026-07-28: server events (SEP-2575)
      - allow: { method: tools/call, tool: { any: ${MCP_TOOLS} } }
binaries: ${AGENT_BINARIES}
