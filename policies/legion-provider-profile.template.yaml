# Provider profile imported once into the workspace (`legion-orch setup-openshell`):
# the gateway exchanges the sandbox's SPIFFE JWT-SVID at the controller and injects the returned
# task-scoped bearer into requests to the controller's MCP and git endpoints only.
id: ${PROFILE_ID}
display_name: Legion orchestrator
description: Controller access (MCP + git) with a task-scoped token obtained from the sandbox's SPIFFE JWT-SVID
category: other
credentials:
  - name: access_token
    description: Short-lived controller token (client_credentials, jwt-spiffe client assertion)
    required: false
    auth_style: bearer
    header_name: Authorization
    token_grant:
      grant_type: client_credentials
      token_endpoint: ${TOKEN_ENDPOINT}
      audience: ${TOKEN_AUDIENCE}
      jwt_svid_audience: ${SVID_AUDIENCE}
      client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-spiffe
      scopes: [${SCOPE}]
      cache_ttl_seconds: ${TOKEN_CACHE_TTL}
endpoints:
  - host: ${MCP_HOST}
    port: ${MCP_PORT}
    path: ${MCP_PATH}
    protocol: mcp
    enforcement: enforce
    # Profiles set the body limit on the endpoint (policies: mcp.max_body_bytes); both are the
    # same JSON-RPC limit inside OpenShell and must be equal (it compares overlapping endpoints).
    json_rpc_max_body_bytes: ${MCP_MAX_BODY_BYTES}
    mcp:
      versions: ${MCP_VERSIONS}
    rules:
      - allow: { method: initialize }
      - allow: { method: notifications/initialized }
      - allow: { method: notifications/cancelled }
      - allow: { method: ping }
      - allow: { method: tools/list }
      - allow: { method: server/discover }
      - allow: { method: subscriptions/listen }      # 2026-07-28: server events (SEP-2575)
      # advertised by the MCP SDK's server, which has no resources or prompts (empty lists)
      - allow: { method: resources/list }
      - allow: { method: resources/templates/list }
      - allow: { method: resources/read }
      - allow: { method: prompts/list }
      - allow: { method: prompts/get }
      - allow: { method: tools/call, tool: { any: ${MCP_TOOLS} } }
  - host: ${GIT_HOST}
    port: ${GIT_PORT}
    protocol: rest
    enforcement: enforce
    rules:
      - allow:
          method: GET
          path: "/git/*.git/**"
      - allow:
          method: HEAD
          path: "/git/*.git/**"
      - allow:
          method: OPTIONS
          path: "/git/*.git/**"
      - allow:
          method: POST
          path: "/git/*.git/git-upload-pack"
      - allow:
          method: POST
          path: "/git/*.git/git-receive-pack"
binaries: ${PROFILE_BINARIES}
