# `openshell --workspace ${WORKSPACE} sandbox create` for a deterministic verifier.
name: ${SANDBOX_NAME}
from: ${VERIFIER_IMAGE}
detach: true
no_tty: true
policy: ${POLICY_FILE}
upload: ${PAYLOAD_UPLOAD}
no_git_ignore: true
provider: ${VERIFIER_PROVIDERS}
driver_config_json: ${DRIVER_CONFIG}   # environment resources (null: driver defaults)
label:
  legion.change: ${CHANGE_ID}
  legion.task: ${TASK_ID}
  legion.role: ${ROLE}
annotation:                       # exact ids (labels are sanitised: build:T1 -> build.T1)
  legion.task: ${TASK_ID}
