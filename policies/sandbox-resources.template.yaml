# `--driver-config-json` for a sandbox whose environment profile requests disk (CPU and memory
# are `sandbox create --cpu / --memory`, see the sandbox templates). Rendered per sandbox; null
# values are dropped and an empty result passes no flag. The top-level key is the gateway's
# compute driver; adjust the field names to your driver.
firecracker:
  disk_mib: ${DISK_MIB}
