description: npm registry, read-only (npm, npx)
endpoints:
  # scoped packages are fetched as /@scope%2fname: keep the encoded slash. The gateway honours
  # allow_encoded_slash only for explicit rules, so this endpoint uses rules, not access.
  - host: registry.npmjs.org
    port: 443
    allow_encoded_slash: true
    rules:
      - allow:
          method: GET
          path: /**
